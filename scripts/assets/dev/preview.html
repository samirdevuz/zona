<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#9fb7cc}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/examples/jsm/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Dev preview of built GLBs. Query: files=a.glb,b.glb  views=fileIndex,yaw,pitch,dist;...  cols=N  node=prefix
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const files = q.get('files').split(',');
const node = q.get('node');
const views = (q.get('views') ?? files.map((_, i) => `${i},0.7,0.35,1.3`).join(';')).split(';').map((v) => v.split(',').map(Number));
const cols = Number(q.get('cols') ?? Math.min(3, views.length));
const rows = Math.ceil(views.length / cols);
const cw = Math.floor(1200 / cols), ch = Math.floor(cw * 0.75);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(1);
r.setSize(cw * cols, ch * rows);
r.setScissorTest(true);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb7cc);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x5a5040, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(30, 50, 20);
scene.add(sun);
const loader = new GLTFLoader();
const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
const groups = [];
for (const [i, f] of files.entries()) {
  const g = await loader.loadAsync('/packages/client/public/assets/' + f);
  const grp = new THREE.Group();
  g.scene.updateMatrixWorld(true);
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    if (node ? !o.name.startsWith(node) : /lod1/.test(o.name)) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, o.name.startsWith('marking') ? new THREE.MeshLambertMaterial({ color: 0x3b82f6 }) : mat);
    m.applyMatrix4(o.matrixWorld);
    grp.add(m);
  });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 32), new THREE.MeshLambertMaterial({ color: 0x6f8a4a }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.001;
  grp.add(ground);
  grp.position.x = i * 200;
  scene.add(grp);
  groups.push(grp);
}
views.forEach(([fi, yaw, pitch, dist], k) => {
  const grp = groups[fi];
  const box = new THREE.Box3();
  for (const m of grp.children.slice(0, -1)) box.expandByObject(m);
  const size = box.getSize(new THREE.Vector3()).length();
  const c = box.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(40, cw / ch, 0.05, 2000);
  const d = size * dist;
  cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * d, c.y + Math.sin(pitch) * d, c.z - Math.cos(yaw) * Math.cos(pitch) * d);
  cam.lookAt(c);
  const x = (k % cols) * cw;
  const y = (rows - 1 - Math.floor(k / cols)) * ch;
  r.setViewport(x, y, cw, ch);
  r.setScissor(x, y, cw, ch);
  r.render(scene, cam);
});
document.title = 'done';
</script></body></html>
